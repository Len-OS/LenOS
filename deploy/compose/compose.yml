name: lenos-prod

services:
  relay:
    image: ${LENOS_IMAGE:-ghcr.io/buildgrowthnow/lenos:main}
    env_file:
      - .env
    environment:
      LENOS_BIND_ADDR: 0.0.0.0:3000
      LENOS_HEALTH_PORT: "8080"
      LENOS_METRICS_PORT: "9102"
      DATABASE_URL: postgres://${POSTGRES_USER:-lenos}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-lenos}
      REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD}@redis:6379
      LENOS_S3_ENDPOINT: http://minio:9000
      # Docker DNS resolves `minio`, not arbitrary `<bucket>.minio` hosts.
      LENOS_S3_ADDRESSING_STYLE: path
      LENOS_S3_ACCESS_KEY: ${LENOS_S3_ACCESS_KEY:?set LENOS_S3_ACCESS_KEY}
      LENOS_S3_SECRET_KEY: ${LENOS_S3_SECRET_KEY:?set LENOS_S3_SECRET_KEY}
      LENOS_S3_BUCKET: ${LENOS_S3_BUCKET:-lenos-media}
      LENOS_GIT_REPO_PATH: /data/git
      LENOS_AUTO_MIGRATE: ${LENOS_AUTO_MIGRATE:-false}
      LENOS_GIT_CONFORMANCE_PROBE: ${LENOS_GIT_CONFORMANCE_PROBE:-true}
    ports:
      - "${LENOS_HTTP_PORT:-3000}:3000"
    volumes:
      - lenos-git-data:/data/git
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    # Probe /_readiness over /dev/tcp because the runtime image has bash but no curl/wget/socat.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -ec 'exec 3<>/dev/tcp/127.0.0.1/8080; printf \"GET /_readiness HTTP/1.1\\r\\nHost: 127.0.0.1\\r\\nConnection: close\\r\\n\\r\\n\" >&3; grep -q \"200 OK\" <&3'",
        ]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s
    restart: unless-stopped
    networks:
      - lenos-net

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lenos}
      POSTGRES_USER: ${POSTGRES_USER:-lenos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - lenos-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    networks:
      - lenos-net

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    volumes:
      - lenos-redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped
    networks:
      - lenos-net

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${LENOS_S3_ACCESS_KEY:?set LENOS_S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${LENOS_S3_SECRET_KEY:?set LENOS_S3_SECRET_KEY}
    volumes:
      - lenos-minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    networks:
      - lenos-net

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      LENOS_S3_ACCESS_KEY: ${LENOS_S3_ACCESS_KEY:?set LENOS_S3_ACCESS_KEY}
      LENOS_S3_SECRET_KEY: ${LENOS_S3_SECRET_KEY:?set LENOS_S3_SECRET_KEY}
      LENOS_S3_BUCKET: ${LENOS_S3_BUCKET:-lenos-media}
    entrypoint: >
      /bin/sh -euc '
        mc alias set local http://minio:9000 "$${LENOS_S3_ACCESS_KEY}" "$${LENOS_S3_SECRET_KEY}"
        mc mb --ignore-existing "local/$${LENOS_S3_BUCKET}"
        mc anonymous set none "local/$${LENOS_S3_BUCKET}"
      '
    restart: "no"
    networks:
      - lenos-net

volumes:
  lenos-postgres-data:
    labels:
      com.lenos.volume: postgres
  lenos-redis-data:
    labels:
      com.lenos.volume: redis
  lenos-minio-data:
    labels:
      com.lenos.volume: minio
  lenos-git-data:
    labels:
      com.lenos.volume: git

networks:
  lenos-net:
    driver: bridge
    labels:
      com.lenos.network: production

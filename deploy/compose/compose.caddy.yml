services:
  relay:
    ports: !reset []

  caddy:
    image: caddy:2-alpine
    depends_on:
      relay:
        condition: service_healthy
    environment:
      LENOS_DOMAIN: ${LENOS_DOMAIN:?set LENOS_DOMAIN}
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - lenos-caddy-data:/data
      - lenos-caddy-config:/config
    restart: unless-stopped
    networks:
      - lenos-net

volumes:
  lenos-caddy-data:
    labels:
      com.lenos.volume: caddy-data
  lenos-caddy-config:
    labels:
      com.lenos.volume: caddy-config
